excludes: [
  "/.git/",
  "/.gemini/",
  "/.pytest_cache/",
  "**/__pycache__/",
  "verl/third_party/dynamo",
  "bench/",
  "/ckpts/",
  "/dpg_subset_qa_viewer/",
  "/logs/",
  "/github_token.txt",
  "/ray_job.log",
  "/txt.txt"
]
env_vars:
  VLLM_USE_V1: "1"
  NCCL_DEBUG: "INFO"
  NCCL_DEBUG_SUBSYS: "INIT,NET"
  HYDRA_FULL_ERROR: "1"
  NCCL_SOCKET_IFNAME: "eth0"
  NCCL_IB_DISABLE: "1"
  NCCL_NET: "Socket"
  GLOO_SOCKET_IFNAME: "eth0"
  NCCL_TIMEOUT: "300000"
  PYTHONPATH: "sglang/python:."
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"